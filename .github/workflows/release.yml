name: Build and publish desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release configuration
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm run release:verify
      - name: Build unsigned Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release configuration
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm run release:verify
      - name: Build unsigned macOS installer
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64-installer
          path: release-assets/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-installer
          path: release-assets/macos-arm64
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm run release:verify
      - name: Label installers by platform
        run: node scripts/release-config.cjs label release-assets
      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/windows/*.exe
          release-assets/macos-x64/*.dmg
          release-assets/macos-arm64/*.dmg
          --title "$RELEASE_TAG"
          --generate-notes
